name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-r2nfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/r2nfs/go.mod
          cache-dependency-path: services/r2nfs/go.sum
      - name: Download dependencies
        working-directory: services/r2nfs
        run: go mod download
      - name: Build
        working-directory: services/r2nfs
        run: go build -o r2nfs .
      - name: Test
        working-directory: services/r2nfs
        run: go test -v -race -count=1 ./...

  go-flintd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: guest/flintd/go.sum
      - name: Download dependencies
        working-directory: guest/flintd
        run: go mod tidy
      - name: Build
        working-directory: guest/flintd
        run: go build -o flintd .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        run: scripts/build-ui.sh
      - name: Control plane embeds the UI
        working-directory: cluster
        run: test -f internal/webui/dist/index.html && go build -o /dev/null ./cmd/flint-cluster

  go-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cluster/go.mod
          cache-dependency-path: cluster/go.sum
      - name: Vet
        working-directory: cluster
        run: go vet ./...
      - name: Test
        working-directory: cluster
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: cluster
        run: go build -o flint-cluster ./cmd/flint-cluster

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive terraform
      - name: Validate
        run: |
          for d in terraform/modules/* terraform/examples/*; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -v

  e2e:
    runs-on: ubuntu-latest
    needs: [go-r2nfs, go-flintd]
    strategy:
      fail-fast: false
      matrix:
        backend: [firecracker, cloud-hypervisor]
        # daemon: tests/ against one daemon. cluster: tests/cluster against a
        # two-host cluster (Postgres and S3 in Docker).
        suite: [daemon, cluster]
    env:
      FLINT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cluster/go.mod
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Build r2nfs
        working-directory: services/r2nfs
        run: go build -o r2nfs .
      - name: Enable KVM access
        run: |
          echo "enable-kvm:start" >> /tmp/step-markers
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "enable-kvm:end" >> /tmp/step-markers
      - name: Install Firecracker + guest kernel
        # Both backends boot Flint's guest kernel, which install-deps downloads.
        run: |
          echo "install-fc:start" >> /tmp/step-markers
          sudo bash scripts/install-deps.sh
          echo "install-fc:end" >> /tmp/step-markers
      - name: Load nbd (image-backed volumes)
        run: |
          sudo modprobe nbd nbds_max=256 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe nbd nbds_max=256
          }
      - name: Install cloud-hypervisor
        if: matrix.backend == 'cloud-hypervisor'
        run: |
          echo "install-ch:start" >> /tmp/step-markers
          set -euxo pipefail
          sudo -E env "PATH=$PATH" uv run flint install-deps --backend cloud-hypervisor --version v46.0 --skip-kernel
          /usr/local/bin/cloud-hypervisor --version
          echo "install-ch:end" >> /tmp/step-markers
      - name: Download Alpine minirootfs
        run: |
          echo "alpine:start" >> /tmp/step-markers
          set -x
          sudo mkdir -p /root/firecracker-vm
          curl -fsSL -o /tmp/alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-minirootfs-3.21.3-x86_64.tar.gz 2>&1 | tee /tmp/alpine-download.log
          sudo mv /tmp/alpine.tar.gz /root/firecracker-vm/alpine-minirootfs-3.21.3-x86_64.tar.gz 2>&1 | tee -a /tmp/alpine-download.log
          sudo ls -la /root/firecracker-vm | tee -a /tmp/alpine-download.log
          echo "alpine:end" >> /tmp/step-markers
      - name: Build rootfs
        run: |
          echo "build-rootfs:start" >> /tmp/step-markers
          sudo -E env "PATH=$PATH" bash -x setup-rootfs.sh 2>&1 | tee /tmp/build-rootfs.log
          rc=${PIPESTATUS[0]}
          echo "build-rootfs:end:$rc" >> /tmp/step-markers
          exit $rc
      - name: Prepare runtime directories
        run: sudo mkdir -p /srv/jailer
      - name: Probe backend plugin
        id: probe
        continue-on-error: true
        run: |
          set -x
          uv run flint backends list 2>&1 | tee /tmp/probe.log
          FLINT_BACKEND=${FLINT_BACKEND} uv run python -c "
          import os
          from flint.core.backends import resolve_backend
          b = resolve_backend()
          print('resolved:', b.name, b.kind)
          print('preflight:', b.preflight())
          " 2>&1 | tee -a /tmp/probe.log
      - name: Run tests
        id: tests
        if: matrix.suite == 'daemon'
        run: |
          sudo -E env "PATH=$PATH" "FLINT_BACKEND=${FLINT_BACKEND}" uv run python -m pytest tests/ --ignore=tests/cluster -v -m "not slow" 2>&1 | tee /tmp/pytest.log
          exit ${PIPESTATUS[0]}
        timeout-minutes: 10
      - name: Run cluster tests
        if: matrix.suite == 'cluster'
        run: |
          (cd cluster && go build -o "$RUNNER_TEMP/flint-cluster" ./cmd/flint-cluster)
          sudo -E env "PATH=$PATH" "FLINT_BACKEND=${FLINT_BACKEND}" "FLINT_CLUSTER_BIN=$RUNNER_TEMP/flint-cluster" \
            uv run python -m pytest tests/cluster -v -m "not slow" --durations=0 2>&1 | tee /tmp/pytest.log
          exit ${PIPESTATUS[0]}
        timeout-minutes: 25
      - name: Print storage and kernel logs
        if: failure()
        run: |
          for f in $(sudo find / -xdev -name r2nfs.log 2>/dev/null); do
            echo "=== $f (last 150 lines) ==="
            sudo tail -150 "$f"
          done
          echo "=== Kernel log: NBD, block and ext4 ==="
          sudo dmesg -T | grep -iE "nbd|I/O error|EXT4|blk_update" | tail -120 || true
          # Include errors from anywhere in the daemon log.
          echo "=== Daemon errors ==="
          sudo grep -n -A25 -E "Traceback|failed:|ERROR" /tmp/flint-test-daemon.log /tmp/flint-test-state/flint-debug.log 2>/dev/null | tail -400 || true

  agent-e2e:
    runs-on: ubuntu-latest
    needs: [go-r2nfs, go-flintd]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: guest/flintd/go.sum
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Build r2nfs
        working-directory: services/r2nfs
        run: go build -o r2nfs .
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Firecracker + kernel
        run: sudo bash scripts/install-deps.sh
      - name: Download Alpine minirootfs
        run: |
          sudo mkdir -p /root/firecracker-vm
          curl -fsSL -o /tmp/alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-minirootfs-3.21.3-x86_64.tar.gz
          sudo mv /tmp/alpine.tar.gz /root/firecracker-vm/alpine-minirootfs-3.21.3-x86_64.tar.gz
      - name: Build rootfs
        run: sudo -E env "PATH=$PATH" bash setup-rootfs.sh
      - name: Prepare runtime directories
        run: sudo mkdir -p /srv/jailer
      - name: Pre-build flintd for template pipeline
        run: |
          cp /tmp/flintd assets/flintd
          ls -la assets/
          echo "flintd binary: $(file assets/flintd)"
      - name: Build agent Docker images locally
        run: |
          for agent_dir in agents/*/; do
            agent_name=$(basename "$agent_dir")
            tag="ghcr.io/jverre/flint/agent-${agent_name}:latest"
            echo "Building ${tag} from ${agent_dir}..."
            docker build -t "$tag" "$agent_dir"
          done
      - name: Verify Docker images and disk space
        run: |
          echo "=== Docker images ==="
          docker images | grep -E "agent-|REPOSITORY"
          echo "=== Disk space ==="
          df -h /
      - name: Verify assets and project layout
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== assets/ contents ==="
          ls -la assets/
          echo "=== Python package location ==="
          sudo -E env "PATH=$PATH" uv run python -c "import flint.core._template_build as tb; print('__file__:', tb.__file__); print('project_root:', tb._find_project_root())"
      - name: Run agent e2e tests
        run: |
          sudo -E env "PATH=$PATH" uv run python -m pytest tests/test_agents.py -v -s --tb=long 2>&1 | tee /tmp/pytest-agent-output.log
          exit ${PIPESTATUS[0]}
        timeout-minutes: 30
      - name: Print daemon log
        if: always()
        run: |
          echo "=== Daemon log (last 200 lines) ==="
          tail -200 /tmp/flint-test-daemon.log 2>/dev/null || echo "No daemon log found"
          echo "=== Flint debug log ==="
          tail -100 /tmp/flint-test-state/flint-debug.log 2>/dev/null || echo "No debug log found"
          echo "=== Disk space ==="
          df -h /

  maintenance-prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked Linux maintenance test environment
        run: docker build -t flint-maintenance-test -f tests/maintenance/Dockerfile .
      - name: Rehearse namespace cutover and shared disk mounts
        run: >-
          docker run --rm --privileged -v "$PWD:/workspace:ro"
          -e FLINT_PRIVILEGED_TESTS=1 flint-maintenance-test
          pytest tests/unit tests/maintenance --basetemp=/tmp/flint-tests
          -o cache_dir=/tmp/pytest-cache -v
